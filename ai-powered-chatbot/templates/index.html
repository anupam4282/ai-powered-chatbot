<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <div class="logo">AI</div>
                <div>
                    <h1>AI-Powered Chatbot</h1>
                    <p><span class="status-dot"></span> Online • NLP Support Assistant</p>
                </div>
            </div>
            <button id="clearBtn" class="clear-btn" title="Clear conversation">Clear</button>
        </header>

        <section id="chatBox" class="chat-box" aria-live="polite"></section>

        <div class="suggestions">
            <button data-message="What are your support hours?">Support hours</button>
            <button data-message="How can I reset my password?">Reset password</button>
            <button data-message="How can I track my order?">Track order</button>
            <button data-message="What features do you have?">Features</button>
        </div>

        <form id="chatForm" class="input-area">
            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >
            <button id="sendBtn" type="submit">Send</button>
        </form>

        <footer>Powered by Python • NLTK • Transformers • Flask • SQLite</footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
